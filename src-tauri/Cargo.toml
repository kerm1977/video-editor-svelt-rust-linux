[package]
name = "videoguru-editor"
version = "0.1.0"
description = "Editor de vídeo multipista para Linux"
authors = ["pmint"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "videoguru_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
thiserror = "1"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
